<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>threesixty. sessions — Photos that move you</title>
<meta name="description" content="Couples, family, portrait and street photo sessions in Houston, TX. Photos that move you.">
<meta name="theme-color" content="#050505">
<meta property="og:title" content="threesixty sessions. — Photos that move you">
<meta property="og:description" content="Couples, family, portrait and street photo sessions in Houston, TX.">
<meta property="og:type" content="website">
<meta property="og:image" content="images/couples/cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23050505'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%239DB82A'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--ink:#EDEDED;--muted:#9A9A9A;--line:rgba(237,237,237,.14);--dim:rgba(237,237,237,.38);--dot:#9DB82A;--pad:clamp(16px,4vw,48px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Geist',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;letter-spacing:.06em;color:var(--muted)}
.app{position:relative;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}

/* header */
header{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px var(--pad)}
.logo{background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:baseline;gap:8px;min-height:44px;text-decoration:none}
.logo b{font-weight:600;font-size:22px;letter-spacing:-.05em}
.logo b span{color:var(--dot)}
.logo i span{color:var(--dot);font-weight:600}
.logo i{font-style:normal;font-weight:300;font-size:22px;letter-spacing:-.03em;color:var(--muted)}
nav{display:flex;align-items:center;gap:20px;font-size:14px;flex-wrap:wrap}
nav a{text-decoration:none}
nav a.biz{color:var(--muted)}
.pill{background:transparent;border:1px solid rgba(237,237,237,.35);border-radius:999px;padding:10px 14px;min-height:44px;font-family:'Geist Mono',monospace;font-size:12px;cursor:pointer;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:var(--bg)}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);text-decoration:none;padding:0 24px;min-height:50px;border-radius:999px;font-weight:500;font-size:15px;transition:transform .2s}
.cta:hover{transform:translateY(-2px)}
.cta .d{width:8px;height:8px;border-radius:999px;background:var(--dot)}

/* backgrounds */
.bgs{position:absolute;inset:0;z-index:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) brightness(.6) contrast(1.1);opacity:0;transform:scale(1.06);transition:opacity .8s ease,transform 1.4s cubic-bezier(.2,.8,.2,1)}
.bg.on{opacity:1;transform:scale(1)}
.shade{position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,5,5,.9) 0%,rgba(5,5,5,.4) 62%,rgba(5,5,5,.2))}

/* index */
#index{position:relative;z-index:2;flex:1;display:flex;flex-direction:column}
.list{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);gap:2px}
.list .mono{margin-bottom:16px}
.row{background:transparent;border:0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;display:flex;align-items:baseline;gap:20px;color:var(--dim);padding:6px 0;transition:color .3s,padding .4s cubic-bezier(.2,.8,.2,1);width:100%}
.row.on{color:#FFF}
.row:hover,.row:focus-visible{padding-left:16px;color:#FFF;outline:none}
.row .n{font-family:'Geist Mono',monospace;font-size:12px;width:32px;flex:none}
.row .name{font-weight:500;font-size:clamp(46px,7.5vw,116px);line-height:1.04;letter-spacing:-.055em}
.row .sub{font-size:13px;color:var(--muted);margin-left:auto;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:20px var(--pad) 24px}
.tag{font-weight:300;font-size:22px;letter-spacing:-.03em;color:#CFCFCF}

/* book */
#book{position:relative;z-index:2;flex:1;display:none;flex-direction:column;gap:14px;padding:0 var(--pad) 22px;min-height:0}
.app.reading #book{display:flex}
.app.reading #index,.app.reading .bgs,.app.reading .shade{display:none}
.bookhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.bookhead h1{margin:0;font-weight:500;font-size:clamp(30px,3.4vw,44px);letter-spacing:-.05em}
.stage{height:min(70vh,820px);border:0;padding:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.photo{max-width:100%;max-height:100%;width:auto;height:auto;display:block;border-radius:14px}
@media (max-width:700px){.stage{height:auto;max-height:68vh}.photo{max-height:68vh}}
.photo.in{animation:pageIn .7s ease both}
@keyframes pageIn{from{opacity:0;transform:scale(1.015)}to{opacity:1;transform:none}}
.bookfoot{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.cap .ig{color:var(--ink);text-decoration:none;border-bottom:1px solid currentColor}
.cap .ig:hover{color:var(--dot)}
.cap strong{display:block;font-weight:500;font-size:22px;letter-spacing:-.03em;margin-bottom:4px}
.ctrl{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.arrow{width:48px;height:48px;border-radius:999px;background:transparent;border:1px solid rgba(237,237,237,.35);cursor:pointer;font-size:16px;transition:background .2s,color .2s}
.arrow:hover{background:var(--ink);color:var(--bg)}
.count{font-family:'Geist Mono',monospace;font-size:12px;min-width:60px;text-align:center}

@media (max-width:700px){
  nav .hide-sm{display:none}
  .row{gap:12px}
  .row .sub{display:none}
  .bookfoot .cta{width:100%;justify-content:center}
}
@media (prefers-reduced-motion:reduce){
  .bg,.row,.cta{transition:none}
  .photo.in{animation:none}
}
.pt{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:currentColor;margin-left:.035em;vertical-align:baseline}
.by{display:flex;align-items:center;gap:12px;margin-top:14px;font-family:'Geist Mono',monospace;font-size:12px;letter-spacing:.04em;color:var(--muted)}
.by img{width:44px;height:44px;border-radius:50%;object-fit:cover;filter:grayscale(1);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="bgs" id="bgs" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <header>
    <a class="logo" href="#" id="home" aria-label="threesixty sessions"><b>threesixty</b><i>sessions<span class="pt" aria-hidden="true"></span></i></a>
    <nav aria-label="Sessions">
      <a href="../" class="biz" data-en="For business →" data-es="Para negocios →">For business →</a>
      <button class="pill" id="lang" type="button">ES</button>
    </nav>
  </header>

  <!-- ENTRADA: índice -->
  <section id="index" aria-label="Sessions">
    <div class="list" id="list">
      <span class="mono" data-en="CHOOSE YOUR MOMENT" data-es="ELIGE TU MOMENTO">CHOOSE YOUR MOMENT</span>
    </div>
    <div class="foot">
      <div class="byline">
        <span class="tag" data-en="Photos that move you." data-es="Fotos que te mueven.">Photos that move you.</span>
        <span class="by"><img src="images/moy.jpg?v=2" alt="Moy Boskez"><span data-en="Behind the lens · Moy Boskez" data-es="Detrás del lente · Moy Boskez">Behind the lens · Moy Boskez</span></span>
      </div>
      <a class="cta wa" href="#" target="_blank" rel="noopener"><span data-en="Book on WhatsApp" data-es="Reservar por WhatsApp">Book on WhatsApp</span><span class="d"></span></a>
    </div>
  </section>

  <!-- LIBRO: fotos de una categoría -->
  <section id="book" aria-live="polite">
    <div class="bookhead">
      <button class="pill" id="back" type="button" data-en="← ALL SESSIONS" data-es="← TODAS LAS SESIONES">← ALL SESSIONS</button>
      <h1 id="catName"></h1>
    </div>
    <button class="stage" id="stage" type="button" aria-label="Next photo"><img class="photo" id="photo" alt=""></button>
    <div class="bookfoot">
      <div class="cap"><strong id="pTitle"></strong><span class="mono" id="pMeta"></span></div>
      <div class="ctrl">
        <button class="arrow" id="prev" type="button" aria-label="Previous photo">←</button>
        <span class="count" id="count"></span>
        <button class="arrow" id="next" type="button" aria-label="Next photo">→</button>
        <a class="cta wa" href="#" target="_blank" rel="noopener"><span data-en="Book this session" data-es="Reservar esta sesión">Book this session</span><span class="d"></span></a>
      </div>
    </div>
  </section>
</div>

<script>
/* =====================================================================
   CONFIGURACIÓN — lo único que necesitas editar
   ===================================================================== */

// 1) Tu WhatsApp: código de país + número, sin +, espacios ni guiones (ej. "18325551234")
var WHATSAPP = "18326211206";

// 2) Categorías y fotos. (La lista se ve en blanco y negro; dentro del libro, las fotos van a color.)
//    - "cover": foto que se ve de fondo al pasar el cursor por el nombre.
//    - "photos": las fotos del libro, en orden. Sube cada archivo a la carpeta indicada.
//    - Puedes agregar o quitar fotos copiando una línea { file: ..., title: ..., meta: ... }.
//    - Si un archivo no existe todavía, se muestra un gris en su lugar.
var SESSIONS = [
  { id: "portraits", en: "Portraits", es: "Retratos",
    subEn: "Personal brand · profile", subEs: "Marca personal · perfil",
    cover: "images/portraits/cover.jpg",
    photos: [
      { file: "images/portraits/01.jpg", title: "Pets lovers", meta: "PORTRAIT · PETS" },
      { file: "images/portraits/02.jpg", title: "Erika Boskez", meta: "HEADSHOT · WHITE" },
      { file: "images/portraits/03.jpg", title: "Ode Victoria", meta: "PERSONAL BRAND", ig: "ode.realtor.texas" },
      { file: "images/portraits/04.jpg", title: "Kids", meta: "PORTRAIT · KIDS" },
      { file: "images/portraits/05.jpg", title: "Sailin Blanco", meta: "PERSONAL BRAND", ig: "sailinblanco.txbroker" },
      { file: "images/portraits/06.jpg", title: "Pets lovers", meta: "PORTRAIT · PETS" },
      { file: "images/portraits/07.jpg", title: "Ode Victoria", meta: "REALTOR", ig: "ode.realtor.texas" },
      { file: "images/portraits/08.jpg", title: "Iris Puac", meta: "REALTOR", ig: "irismarilurealtor" }
    ] },
  { id: "maternity", en: "Maternity", es: "Maternidad",
    subEn: "Waiting together", subEs: "Esperándote juntos",
    cover: "images/maternity/cover.jpg",
    photos: [
      { file: "images/maternity/01.jpg", title: "[Nombres]", meta: "MATERNITY · [LUGAR], TX · [AÑO]" },
      { file: "images/maternity/02.jpg", title: "[Nombres]", meta: "MATERNITY · [LUGAR], TX · [AÑO]" },
      { file: "images/maternity/03.jpg", title: "[Nombres]", meta: "MATERNITY · [LUGAR], TX · [AÑO]" },
      { file: "images/maternity/04.jpg", title: "[Nombres]", meta: "MATERNITY · [LUGAR], TX · [AÑO]" },
      { file: "images/maternity/05.jpg", title: "[Nombres]", meta: "MATERNITY · [LUGAR], TX · [AÑO]" },
      { file: "images/maternity/06.jpg", title: "[Nombres]", meta: "MATERNITY · [LUGAR], TX · [AÑO]" }
    ] },
  { id: "graduation", en: "Graduation", es: "Graduación",
    subEn: "Cap, gown & what comes next", subEs: "Toga, birrete y lo que viene",
    cover: "images/graduation/cover.jpg",
    photos: [
      { file: "images/graduation/01.jpg", title: "[Nombre]", meta: "GRADUATION · [LUGAR], TX · [AÑO]" },
      { file: "images/graduation/02.jpg", title: "[Nombre]", meta: "GRADUATION · [LUGAR], TX · [AÑO]" },
      { file: "images/graduation/03.jpg", title: "[Nombre]", meta: "GRADUATION · [LUGAR], TX · [AÑO]" },
      { file: "images/graduation/04.jpg", title: "[Nombre]", meta: "GRADUATION · [LUGAR], TX · [AÑO]" },
      { file: "images/graduation/05.jpg", title: "[Familia]", meta: "GRADUATION · FAMILY · [LUGAR], TX · [AÑO]" }
    ] }

];

/* ===================================================================== */
(function(){
  var app = document.getElementById('app');
  var list = document.getElementById('list');
  var bgs = document.getElementById('bgs');
  var photo = document.getElementById('photo');
  var lang = 'en', active = 0, cat = null, idx = 0;
  var GRAYS = ['linear-gradient(160deg,#2A2A2A,#A0A0A0)','linear-gradient(200deg,#1A1A1A,#8C8C8C)','linear-gradient(140deg,#252525,#9C9C9C)','linear-gradient(120deg,#111,#6A6A6A)'];
  // Versión de archivos: cámbiala si reemplazas una foto con el mismo nombre
  var V = '?v=20261028b';
  function bgFor(file, i){ return 'url("' + file + V + '"), ' + GRAYS[i % GRAYS.length]; }

  try { lang = localStorage.getItem('ts-lang') || (navigator.language || 'en').slice(0,2); } catch(e) {}
  if (lang !== 'es') lang = 'en';

  // construir índice y fondos
  var rows = SESSIONS.map(function(s, i){
    var bg = document.createElement('div');
    bg.className = 'bg'; bg.style.backgroundImage = bgFor(s.cover.replace('cover.jpg','cover-bw.jpg'), i);
    bgs.appendChild(bg);
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'row';
    b.innerHTML = '<span class="n">' + String(i+1).padStart(2,'0') + '</span><span class="name"></span><span class="sub"></span>';
    b.addEventListener('mouseenter', function(){ setActive(i); });
    b.addEventListener('focus', function(){ setActive(i); });
    b.addEventListener('click', function(){ location.hash = s.id; });
    list.appendChild(b);
    return { bg: bg, btn: b };
  });
  function setActive(i){
    active = i;
    rows.forEach(function(r, j){ r.bg.classList.toggle('on', j === i); r.btn.classList.toggle('on', j === i); });
  }

  // libro
  function show(){
    var s = SESSIONS[cat], p = s.photos[idx];
    photo.className = 'photo';
    void photo.offsetWidth;
    photo.src = p.file + V;
    photo.className = 'photo in';
    // Textos entre [corchetes] son pendientes: no se muestran
    var t = /\[/.test(p.title) ? '' : p.title;
    var m = p.meta.split(' · ').filter(function(x){ return !/\[/.test(x); }).join(' · ');
    photo.alt = (t ? t + ' — ' : '') + m;
    document.getElementById('pTitle').textContent = t;
    var pm = document.getElementById('pMeta');
    pm.textContent = m;
    if (p.ig) { var a = document.createElement('a'); a.href = 'https://instagram.com/' + p.ig; a.target = '_blank'; a.rel = 'noopener'; a.className = 'ig'; a.textContent = '@' + p.ig; if (m) pm.appendChild(document.createTextNode(' · ')); pm.appendChild(a); }
    document.getElementById('count').textContent = String(idx+1).padStart(2,'0') + ' / ' + String(s.photos.length).padStart(2,'0');
    document.getElementById('catName').textContent = s[lang];
    updateWA();
  }
  function updateWA(){
    var c = cat !== null ? SESSIONS[cat][lang].toLowerCase() : null;
    var msg = lang === 'en'
      ? (c ? "Hi! I'd like to book a " + c + " photo session." : "Hi! I'd like to book a photo session.")
      : (c ? 'Hola, me gustaría reservar una sesión de fotos de ' + c + '.' : 'Hola, me gustaría reservar una sesión de fotos.');
    document.querySelectorAll('.wa').forEach(function(a){ a.href = 'https://wa.me/' + WHATSAPP + '?text=' + encodeURIComponent(msg); });
  }
  function go(d){ var n = SESSIONS[cat].photos.length; idx = (idx + d + n) % n; show(); }
  function route(){
    var id = location.hash.replace('#','');
    var i = SESSIONS.findIndex(function(s){ return s.id === id; });
    if (i >= 0) { cat = i; idx = 0; app.classList.add('reading'); show(); window.scrollTo(0,0); }
    else { cat = null; app.classList.remove('reading'); setActive(active); updateWA(); }
  }
  document.getElementById('next').addEventListener('click', function(){ go(1); });
  document.getElementById('prev').addEventListener('click', function(){ go(-1); });
  document.getElementById('stage').addEventListener('click', function(){ go(1); });
  document.getElementById('back').addEventListener('click', function(){ location.hash = ''; });
  document.getElementById('home').addEventListener('click', function(e){ e.preventDefault(); history.pushState('', document.title, location.pathname); route(); });
  document.addEventListener('keydown', function(e){
    if (cat === null) return;
    if (e.key === 'ArrowRight') go(1);
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'Escape') location.hash = '';
  });
  // deslizar en el teléfono
  var x0 = null;
  var stage = document.getElementById('stage');
  stage.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function(e){
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
  });
  window.addEventListener('hashchange', route);

  // idioma
  var langBtn = document.getElementById('lang');
  function applyLang(){
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-' + lang + ']').forEach(function(el){ el.textContent = el.getAttribute('data-' + lang); });
    rows.forEach(function(r, i){
      var s = SESSIONS[i];
      r.btn.querySelector('.name').textContent = s[lang];
      r.btn.querySelector('.sub').textContent = (lang === 'en' ? s.subEn : s.subEs) + ' →';
      r.btn.setAttribute('aria-label', s[lang]);
    });
    var es = lang === 'es';
    document.getElementById('stage').setAttribute('aria-label', es ? 'Siguiente foto' : 'Next photo');
    document.getElementById('next').setAttribute('aria-label', es ? 'Siguiente foto' : 'Next photo');
    document.getElementById('prev').setAttribute('aria-label', es ? 'Foto anterior' : 'Previous photo');
    langBtn.textContent = lang === 'en' ? 'ES' : 'EN';
    langBtn.setAttribute('aria-label', lang === 'en' ? 'Cambiar a español' : 'Switch to English');
    updateWA();
    if (cat !== null) document.getElementById('catName').textContent = SESSIONS[cat][lang];
    try { localStorage.setItem('ts-lang', lang); } catch(e) {}
  }
  langBtn.addEventListener('click', function(){ lang = lang === 'en' ? 'es' : 'en'; applyLang(); });

  applyLang();
  setActive(0);
  route();
})();
</script>
</body>
</html>
